name: collect-real-snapshots

on:
  workflow_dispatch:

concurrency:
  group: adoptrank-live-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "backend[ops]"
      - name: Collect GitHub and PyPI observations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          SNAPSHOT_PATH="backend/data/snapshots/$(date -u +%FT%H%MZ).jsonl"
          echo "SNAPSHOT_PATH=$SNAPSHOT_PATH" >> "$GITHUB_ENV"
          adoptrank collect --queries backend/seed_queries.txt --output "$SNAPSHOT_PATH" --per-query 50
      - name: Index changed repository code with Tree-sitter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: adoptrank analyze-code --snapshots "$SNAPSHOT_PATH" --output "backend/data/snapshots/$(date -u +%FT%H%MZ)-code.jsonl" --limit 50 --files-per-repo 12
      - uses: actions/upload-artifact@v4
        with:
          name: adoptrank-snapshot-${{ github.run_id }}
          path: backend/data/snapshots/*-code.jsonl
          retention-days: 90
