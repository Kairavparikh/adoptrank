services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: adoptrank
      POSTGRES_USER: adoptrank
      POSTGRES_PASSWORD: adoptrank-local
    ports:
      - "5432:5432"
    volumes:
      - adoptrank-postgres:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

  ranker:
    build: ./backend
    environment:
      MODEL_DIR: /models/current
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DATABASE_URL: postgresql://adoptrank:adoptrank-local@postgres:5432/adoptrank
    ports:
      - "8000:8000"
    volumes:
      - ./backend/artifacts:/models
      - ./backend/data:/app/data
    depends_on:
      - postgres

volumes:
  adoptrank-postgres:
